name: build-web
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-web.yml'
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          image: tonistiigi/binfmt:qemu-v8.1.5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./web/Dockerfile
          platforms: linux/arm64
          push: true
          build-args: |
            BACKEND_URL=http://home_assistant:3000
          tags: |
            ghcr.io/${{ github.repository_owner }}/home_assistant-web:latest
            ghcr.io/${{ github.repository_owner }}/home_assistant-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
