services:
  # Home Assistant
  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:stable
    volumes:
      - ./data/homeassistant:/config
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=${HASS_TIMEZONE:-Europe/Andorra}
    restart: unless-stopped
    network_mode: ${DOCKER_NETWORK_MODE:-bridge} 
    ports:
      - "${HASS_PORT:-8123}:8123"

  # PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # MQTT Broker (Mosquitto)
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./data/mosquitto/config:/mosquitto/config
      - ./data/mosquitto/data:/mosquitto/data
      - ./data/mosquitto/log:/mosquitto/log

  # Zigbee2MQTT
  zigbee2mqtt:
    container_name: zigbee2mqtt
    image: koenkk/zigbee2mqtt
    restart: unless-stopped
    volumes:
      - ./data/zigbee2mqtt:/data
      - /run/udev:/run/udev:ro
    ports:
      - "8080:8080"
    environment:
      - TZ=${HASS_TIMEZONE:-Europe/Andorra}
    # devices:
    #   - /dev/ttyACM0:/dev/ttyACM0 # Ajustar según el dongle en la RPi

  # Node.js App (Backend/Services)
  app:
    build: 
      context: ./services
      dockerfile: Dockerfile
    container_name: home_services
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      DATABASE_URL: ${DATABASE_URL}
      HASS_TOKEN: ${HASS_TOKEN}
      HASS_URL: ${HASS_URL}
    volumes:
      - ./services:/usr/src/app
      - /usr/src/app/node_modules
