services:
  # PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # MQTT Broker (Mosquitto)
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./data/mosquitto/config:/mosquitto/config
      - ./data/mosquitto/data:/mosquitto/data
      - ./data/mosquitto/log:/mosquitto/log

  # Zigbee2MQTT
  zigbee2mqtt:
    container_name: zigbee2mqtt
    image: koenkk/zigbee2mqtt
    restart: unless-stopped
    volumes:
      - ./data/zigbee2mqtt:/data
      - /run/udev:/run/udev:ro
    ports:
      - "8080:8080"
    environment:
      - TZ=${TZ:-Europe/Andorra}
    devices:
      # Ruta estable del Sonoff Dongle Plus MG24. Obtener con: ls -l /dev/serial/by-id/
      - /dev/serial/by-id/usb-SONOFF_SONOFF_Dongle_Plus_MG24_bcf2b91e89a3ef11ab8f4fbd61ce3355-if00-port0:/dev/serial/by-id/usb-SONOFF_SONOFF_Dongle_Plus_MG24_bcf2b91e89a3ef11ab8f4fbd61ce3355-if00-port0

  # Node.js Backend
  app:
    build:
      context: ./services
      dockerfile: Dockerfile
    container_name: home_services
    restart: unless-stopped
    depends_on:
      - postgres
      - mosquitto
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - ./services:/usr/src/app
      - /usr/src/app/node_modules
